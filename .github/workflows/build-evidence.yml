name: build-evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-core-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build platform core from lockfile
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm sbom --sbom-format=cyclonedx --sbom-type=application > ../platform-core-sbom.json
      - name: Record immutable build bytes and digest
        run: |
          tar -czf platform-core-build.tgz -C backend dist package.json package-lock.json
          sha256sum platform-core-build.tgz > platform-core-build.sha256
          test -s platform-core-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-core-build-${{ github.sha }}
          path: |
            platform-core-build.tgz
            platform-core-build.sha256
            platform-core-sbom.json
          if-no-files-found: error
          retention-days: 30
