services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: platform_core
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d platform_core"]
      interval: 10s
      timeout: 5s
      retries: 5
