name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: platform_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core -d platform_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          PLATFORM_CORE_TEST_DATABASE_URL: postgresql://core:core@127.0.0.1:5432/platform_core_test
